name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        override: true
    - name: Build
      run: cargo build --workspace --features all-no-llvm --verbose
    - name: Run tests
      run: cargo test --workspace --features all-no-llvm --verbose
    - name: Install cargo-binstall
      run: cargo install cargo-binstall
    - name: Install cargo-semver-checks (binstall with fallback)
      run: cargo binstall cargo-semver-checks --no-confirm || cargo install cargo-semver-checks
    - name: Run cargo semver-checks
      run: cargo semver-checks check-release
